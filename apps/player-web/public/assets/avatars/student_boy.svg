<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_leo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#bfdbfe" />
      <stop offset="100%" stopColor="#93c5fd" />
    </linearGradient>
    <linearGradient id="skin_leo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff7ed" />
      <stop offset="100%" stopColor="#ffedd5" />
    </linearGradient>
    <linearGradient id="hair_leo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5c2c16" />
      <stop offset="50%" stopColor="#78350f" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>
    <linearGradient id="eye_leo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a" />
      <stop offset="100%" stopColor="#3b82f6" />
    </linearGradient>
    <filter id="avatar_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="100" cy="100" r="94" fill="url(#bg_leo)" stroke="#60a5fa" stroke-width="6" filter="url(#avatar_shadow)" />

  <!-- School Uniform Jacket & Collar -->
  <path d="M30,195 Q100,140 170,195 L170,200 L30,200 Z" fill="#1e40af" stroke="#172554" stroke-width="3" />
  <!-- White Shirt & Red Tie -->
  <polygon points="80,150 100,185 120,150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="96,155 104,155 102,192 98,192" fill="#ef4444" />

  <!-- Neck -->
  <rect x="86" y="125" width="28" height="30" rx="6" fill="url(#skin_leo)" />

  <!-- Head & Ears -->
  <ellipse cx="100" cy="92" rx="44" ry="46" fill="url(#skin_leo)" stroke="#fdba74" stroke-width="2" />
  <!-- Ears -->
  <ellipse cx="54" cy="94" rx="11" ry="14" fill="url(#skin_leo)" stroke="#fdba74" stroke-width="2" />
  <ellipse cx="146" cy="94" rx="11" ry="14" fill="url(#skin_leo)" stroke="#fdba74" stroke-width="2" />

  <!-- Hair Base / Back -->
  <path d="M48,80 Q100,18 152,80 Q162,50 138,28 Q100,16 62,28 Q38,50 48,80 Z" fill="url(#hair_leo)" />

  <!-- === BIG CLEAR EXPRESSIVE ANIME EYES === -->
  <!-- Left Eye -->
  <g transform="translate(68, 76)">
    <!-- Eye Base -->
    <ellipse cx="10" cy="14" rx="11" ry="15" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <!-- Iris -->
    <ellipse cx="10" cy="14" rx="9" ry="13" fill="url(#eye_leo)" />
    <!-- Pupil -->
    <ellipse cx="10" cy="15" rx="5" ry="7" fill="#091e42" />
    <!-- Highlights -->
    <circle cx="6" cy="8" r="4.5" fill="#ffffff" />
    <circle cx="13" cy="18" r="2.5" fill="#ffffff" />
    <!-- Eyelash Line -->
    <path d="M-3,5 Q10,0 23,6" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g transform="translate(112, 76)">
    <!-- Eye Base -->
    <ellipse cx="10" cy="14" rx="11" ry="15" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <!-- Iris -->
    <ellipse cx="10" cy="14" rx="9" ry="13" fill="url(#eye_leo)" />
    <!-- Pupil -->
    <ellipse cx="10" cy="15" rx="5" ry="7" fill="#091e42" />
    <!-- Highlights -->
    <circle cx="6" cy="8" r="4.5" fill="#ffffff" />
    <circle cx="13" cy="18" r="2.5" fill="#ffffff" />
    <!-- Eyelash Line -->
    <path d="M-3,6 Q10,0 23,5" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Friendly Eyebrows -->
  <path d="M66,66 Q78,59 90,66" stroke="#451a03" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M110,66 Q122,59 134,66" stroke="#451a03" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <ellipse cx="66" cy="108" rx="9" ry="5" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="134" cy="108" rx="9" ry="5" fill="#f43f5e" opacity="0.45" />

  <!-- Cute Nose -->
  <path d="M99,102 Q100,105 103,104" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Radiant Cheerful Open Mouth (Anime Smile) -->
  <path d="M88,114 Q100,132 112,114 Z" fill="#e11d48" stroke="#881337" stroke-width="3" stroke-linejoin="round" />
  <path d="M93,114 Q100,120 107,114" fill="#ffffff" /> <!-- Top Teeth Highlight -->
  <path d="M94,124 Q100,120 106,124" fill="#fda4af" /> <!-- Tongue -->

  <!-- Anime Front Hair Bangs with Natural Spikes -->
  <path d="M52,65 Q74,40 88,68 Q98,38 112,68 Q126,45 148,65 Q140,32 100,24 Q60,32 52,65 Z" fill="url(#hair_leo)" />
  <path d="M90,44 L96,66 L102,48" fill="url(#hair_leo)" />
</svg>
