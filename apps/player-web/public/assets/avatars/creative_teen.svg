<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_creative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7" />
      <stop offset="100%" stopColor="#fed7aa" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff1e6" />
      <stop offset="100%" stopColor="#fed7aa" />
    </linearGradient>
    <linearGradient id="hair_creative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1e293b" />
    </linearGradient>
    <linearGradient id="jacket_creative" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#c2410c" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg_creative)" stroke="#fb923c" stroke-width="4" />
  
  <!-- Headphones Band Behind Head -->
  <path d="M26,55 Q60,10 94,55" stroke="#0ea5e9" stroke-width="6" fill="none" stroke-linecap="round" />
  
  <!-- Shoulders / Trendy Hoodie -->
  <path d="M22,110 Q60,82 98,110 L98,120 L22,120 Z" fill="url(#jacket_creative)" />
  <path d="M48,96 Q60,115 72,96 Z" fill="#1e293b" />
  
  <!-- Neck -->
  <rect x="52" y="72" width="16" height="18" fill="url(#skin)" rx="4" />
  
  <!-- Head Base -->
  <ellipse cx="60" cy="54" rx="26" ry="28" fill="url(#skin)" />
  
  <!-- Headphone Ear Pads -->
  <rect x="22" y="44" width="10" height="20" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="88" y="44" width="10" height="20" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Hair Fluffy Anime Style -->
  <path d="M32,45 Q60,12 88,45 Q94,30 82,18 Q60,12 38,18 Q26,30 32,45 Z" fill="url(#hair_creative)" />
  
  <!-- Eyes with Cool Expression -->
  <ellipse cx="48" cy="53" rx="4.5" ry="5.5" fill="#1e293b" />
  <circle cx="46.5" cy="51" r="1.8" fill="#ffffff" />
  
  <ellipse cx="72" cy="53" rx="4.5" ry="5.5" fill="#1e293b" />
  <circle cx="70.5" cy="51" r="1.8" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M43,44 Q48,40 53,42" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M67,42 Q72,40 77,44" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Cheeks Blush -->
  <ellipse cx="42" cy="62" rx="4.5" ry="2" fill="#f43f5e" opacity="0.3" />
  <ellipse cx="78" cy="62" rx="4.5" ry="2" fill="#f43f5e" opacity="0.3" />
  
  <!-- Confident Smile -->
  <path d="M54,66 Q61,71 67,65" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Front Bangs Spikes -->
  <path d="M34,42 Q44,28 52,44 Q60,26 68,44 Q76,32 86,40 Q80,22 60,18 Q40,22 34,42 Z" fill="url(#hair_creative)" />
</svg>
