<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fce7f3" />
      <stop offset="100%" stopColor="#fbcfe8" />
    </linearGradient>
    <linearGradient id="skin_mia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff7ed" />
      <stop offset="100%" stopColor="#ffedd5" />
    </linearGradient>
    <linearGradient id="hair_mia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#92400e" />
    </linearGradient>
    <linearGradient id="eye_mia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#047857" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <filter id="mia_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#db2777" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="100" cy="100" r="94" fill="url(#bg_mia)" stroke="#f472b6" stroke-width="6" filter="url(#mia_shadow)" />

  <!-- Twin tails hair back -->
  <path d="M42,80 Q15,125 24,165 Q42,155 46,120 Z" fill="url(#hair_mia)" />
  <path d="M158,80 Q185,125 176,165 Q158,155 154,120 Z" fill="url(#hair_mia)" />
  <!-- Red Hair Ribbons -->
  <circle cx="44" cy="94" r="7" fill="#f43f5e" />
  <circle cx="156" cy="94" r="7" fill="#f43f5e" />

  <!-- School Cardigan / Jacket -->
  <path d="M30,195 Q100,140 170,195 L170,200 L30,200 Z" fill="#db2777" stroke="#9d174d" stroke-width="3" />
  <polygon points="76,150 100,185 124,150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="100" cy="170" r="4" fill="#facc15" />

  <!-- Neck -->
  <rect x="86" y="125" width="28" height="30" rx="6" fill="url(#skin_mia)" />

  <!-- Head Base -->
  <ellipse cx="100" cy="92" rx="44" ry="46" fill="url(#skin_mia)" stroke="#fdba74" stroke-width="2" />
  <ellipse cx="54" cy="94" rx="10" ry="13" fill="url(#skin_mia)" stroke="#fdba74" stroke-width="2" />
  <ellipse cx="146" cy="94" rx="10" ry="13" fill="url(#skin_mia)" stroke="#fdba74" stroke-width="2" />

  <!-- Hair Top -->
  <path d="M48,80 Q100,18 152,80 Q160,45 136,24 Q100,16 64,24 Q40,45 48,80 Z" fill="url(#hair_mia)" />

  <!-- === BIG SHINING EMERALD EYES === -->
  <!-- Left Eye -->
  <g transform="translate(68, 76)">
    <ellipse cx="10" cy="14" rx="11.5" ry="15.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <ellipse cx="10" cy="14" rx="9.5" ry="13.5" fill="url(#eye_mia)" />
    <ellipse cx="10" cy="15" rx="5.5" ry="7.5" fill="#022c22" />
    <circle cx="6" cy="7.5" r="5" fill="#ffffff" />
    <circle cx="13.5" cy="18" r="2.5" fill="#ffffff" />
    <!-- Eyelash Line with flick -->
    <path d="M-4,5 Q10,-2 24,5 L28,0" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g transform="translate(112, 76)">
    <ellipse cx="10" cy="14" rx="11.5" ry="15.5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <ellipse cx="10" cy="14" rx="9.5" ry="13.5" fill="url(#eye_mia)" />
    <ellipse cx="10" cy="15" rx="5.5" ry="7.5" fill="#022c22" />
    <circle cx="6" cy="7.5" r="5" fill="#ffffff" />
    <circle cx="13.5" cy="18" r="2.5" fill="#ffffff" />
    <!-- Eyelash Line with flick -->
    <path d="M-4,5 L0,0 Q14,-2 24,5" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Eyebrows -->
  <path d="M66,64 Q78,57 90,64" stroke="#92400e" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M110,64 Q122,57 134,64" stroke="#92400e" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Cheeks Blush -->
  <ellipse cx="64" cy="108" rx="10" ry="6" fill="#fb7185" opacity="0.5" />
  <ellipse cx="136" cy="108" rx="10" ry="6" fill="#fb7185" opacity="0.5" />

  <!-- Nose -->
  <path d="M99,102 Q100,105 103,104" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sweet Cheerful Smile -->
  <path d="M88,114 Q100,130 112,114 Z" fill="#e11d48" stroke="#881337" stroke-width="3" />
  <path d="M93,114 Q100,119 107,114" fill="#ffffff" />

  <!-- Front Hair Bangs with Soft Curls -->
  <path d="M52,65 Q74,80 88,55 Q100,75 112,55 Q126,80 148,65 Q140,30 100,22 Q60,30 52,65 Z" fill="url(#hair_mia)" />
</svg>
