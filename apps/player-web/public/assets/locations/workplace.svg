<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="work_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f8fafc" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="30" fill="url(#work_sky)" />
  <ellipse cx="100" cy="165" rx="80" ry="25" fill="#cbd5e1" />
  
  <!-- Modern Office Tower -->
  <rect x="55" y="40" width="90" height="115" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  
  <!-- Glass Window Grid -->
  <rect x="65" y="50" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="90" y="50" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="115" y="50" width="20" height="20" rx="2" fill="url(#glass)" />
  
  <rect x="65" y="75" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="90" y="75" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="115" y="75" width="20" height="20" rx="2" fill="url(#glass)" />
  
  <rect x="65" y="100" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="90" y="100" width="20" height="20" rx="2" fill="url(#glass)" />
  <rect x="115" y="100" width="20" height="20" rx="2" fill="url(#glass)" />
  
  <!-- Modern Glass Entrance -->
  <rect x="85" y="125" width="30" height="30" rx="2" fill="#0f172a" />
  
  <!-- Briefcase Icon Badge on Top -->
  <g transform="translate(85, 20)">
    <rect x="0" y="5" width="30" height="20" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
    <path d="M8,5 L8,0 L22,0 L22,5" fill="none" stroke="#c2410c" stroke-width="2" />
    <circle cx="15" cy="15" r="2" fill="#ffffff" />
  </g>
</svg>
