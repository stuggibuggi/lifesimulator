<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="park_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fdf2f8" />
      <stop offset="100%" stopColor="#fce7f3" />
    </linearGradient>
    <linearGradient id="pond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7dd3fc" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="30" fill="url(#park_sky)" />
  
  <!-- Green Island -->
  <ellipse cx="100" cy="155" rx="85" ry="32" fill="#86efac" />
  
  <!-- Pond -->
  <ellipse cx="80" cy="165" rx="45" ry="18" fill="url(#pond)" />
  <circle cx="70" cy="162" r="4" fill="#f472b6" />
  
  <!-- Wooden Bridge -->
  <path d="M55,158 Q80,148 105,158" stroke="#9a3412" stroke-width="4" fill="none" />
  
  <!-- Giant Sakura Cherry Blossom Tree -->
  <g transform="translate(115, 65)">
    <!-- Trunk -->
    <path d="M12,70 Q8,35 2,0 Q18,35 22,70 Z" fill="#78350f" />
    <!-- Pink Blossom Fluffy Clouds -->
    <circle cx="-18" cy="-15" r="32" fill="#fbcfe8" opacity="0.95" />
    <circle cx="22" cy="-20" r="35" fill="#f472b6" opacity="0.9" />
    <circle cx="2" cy="-45" r="34" fill="#fce7f3" opacity="0.95" />
    <circle cx="-6" cy="-10" r="24" fill="#ec4899" opacity="0.75" />
  </g>
  
  <!-- Japanese Torii Gate -->
  <g transform="translate(25, 85) scale(0.7)">
    <rect x="10" y="0" width="70" height="8" rx="2" fill="#ef4444" />
    <rect x="15" y="16" width="60" height="6" fill="#ef4444" />
    <rect x="22" y="0" width="8" height="65" rx="2" fill="#dc2626" />
    <rect x="60" y="0" width="8" height="65" rx="2" fill="#dc2626" />
  </g>
</svg>
