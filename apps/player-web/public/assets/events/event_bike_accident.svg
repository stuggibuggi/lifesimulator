<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="evt_bike_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fee2e2" />
      <stop offset="100%" stopColor="#fecaca" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#evt_bike_bg)" />
  
  <!-- Bicycle -->
  <g transform="translate(35, 45)">
    <!-- Wheels -->
    <circle cx="20" cy="55" r="16" fill="none" stroke="#334155" stroke-width="3" />
    <circle cx="75" cy="55" r="16" fill="none" stroke="#334155" stroke-width="3" />
    <!-- Frame -->
    <polygon points="20,55 45,55 60,30 35,30" fill="none" stroke="#ef4444" stroke-width="3" />
    <line x1="45" y1="55" x2="40" y2="25" stroke="#ef4444" stroke-width="3" />
    <line x1="75" y1="55" x2="68" y2="20" stroke="#ef4444" stroke-width="3" />
    <!-- Handlebar & Seat -->
    <line x1="60" y1="20" x2="72" y2="20" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="34" y1="25" x2="46" y2="25" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Alert Triangle -->
  <g transform="translate(105, 20)">
    <polygon points="18,0 36,32 0,32" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <text x="18" y="27" text-anchor="middle" fill="#713f12" font-size="16" font-weight="900" font-family="sans-serif">!</text>
  </g>
</svg>
