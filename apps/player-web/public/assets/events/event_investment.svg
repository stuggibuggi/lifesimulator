<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="evt_inv_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f0f9ff" />
      <stop offset="100%" stopColor="#e0f2fe" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#evt_inv_bg)" />
  
  <!-- Upward Trend Chart -->
  <g transform="translate(30, 30)">
    <!-- Grid -->
    <line x1="0" y1="90" x2="100" y2="90" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="90" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Rising Line -->
    <path d="M10,80 L35,60 L60,70 L95,20" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Rocket / Arrow Head -->
    <polygon points="95,12 105,25 90,25" fill="#0284c7" />
    
    <!-- Dots -->
    <circle cx="10" cy="80" r="4" fill="#38bdf8" />
    <circle cx="35" cy="60" r="4" fill="#38bdf8" />
    <circle cx="60" cy="70" r="4" fill="#38bdf8" />
    <circle cx="95" cy="20" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  </g>
</svg>
