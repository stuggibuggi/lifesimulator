<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="evt_trip_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fdf2f8" />
      <stop offset="100%" stopColor="#fce7f3" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#evt_trip_bg)" />
  
  <!-- Palm Trees -->
  <g transform="translate(100, 25)">
    <path d="M20,95 Q15,50 5,10" stroke="#78350f" stroke-width="4" fill="none" />
    <path d="M5,10 Q20,-5 35,5" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M5,10 Q-15,-5 -25,10" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M5,10 Q5,-15 15,-20" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Travel Suitcase with Stickers -->
  <g transform="translate(30, 60)">
    <rect x="0" y="15" width="65" height="50" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <path d="M20,15 L20,5 Q32,0 45,5 L45,15" stroke="#78350f" stroke-width="3" fill="none" />
    <!-- Straps -->
    <line x1="18" y1="15" x2="18" y2="65" stroke="#78350f" stroke-width="2" />
    <line x1="47" y1="15" x2="47" y2="65" stroke="#78350f" stroke-width="2" />
    <!-- Stickers -->
    <circle cx="32" cy="35" r="7" fill="#ef4444" />
    <polygon points="32,30 34,34 38,34 35,37 36,41 32,38 28,41 29,37 26,34 30,34" fill="#ffffff" />
  </g>
</svg>
