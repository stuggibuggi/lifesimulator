<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="evt_promo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7" />
      <stop offset="100%" stopColor="#fde68a" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#evt_promo_bg)" />
  
  <!-- Graduation Diploma / Certificate -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="80" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="15" y1="20" x2="65" y2="20" stroke="#f59e0b" stroke-width="3" />
    <line x1="15" y1="35" x2="65" y2="35" stroke="#94a3b8" stroke-width="2" />
    <line x1="15" y1="48" x2="50" y2="48" stroke="#94a3b8" stroke-width="2" />
    <line x1="15" y1="61" x2="55" y2="61" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Golden Seal -->
    <circle cx="40" cy="85" r="12" fill="#facc15" stroke="#d97706" stroke-width="2" />
    <!-- Ribbons -->
    <polygon points="35,93 30,110 40,105" fill="#ef4444" />
    <polygon points="45,93 50,110 40,105" fill="#ef4444" />
